<!DOCTYPE html>
<style>

</style>
<head>
    <title>Node demo</title>
    <link rel="icon" type="image/png" href="https://images-ext-1.discordapp.net/external/G-GxnuHyZoNCXyzhinV-fvwy9CWDTKhDvY9duLbpJm0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/747255405616562269/11fb80cf255901f2cbc34bed3b925fcf.png?format=webp&quality=lossless&width=245&height=245">
</head>
<body>
    <svg height="800px" width="800px" style="border:5px double black;">
    </svg>
    <br>
    <div style="border:1px solid black;width:fit-content;margin:5px;padding:5px;">
        <button onclick="addCircle(Math.random() * (screenheight - 2 * radius) + radius,Math.random() * (screenheight - 2 * radius) + radius,radius,getRandomColor(),Math.floor(Math.random() * start_velo) - (start_velo / 2),Math.floor(Math.random() * start_velo) - (start_velo / 2))">Add Circle</button>
        <button onclick="addCon(Math.floor(Math.random() * circlenum),Math.floor(Math.random() * circlenum))">Add Connection</button>
    </div>
</body>
<script>
    let screenwidth = 800;
    let screenheight = 800;
    let radius = 10;
    let gravity = 0;
    let Friction = .995;
    let FPS = 60;
    let start_velo = 10;

    let circle_velocity_x = [];
    let circle_velocity_y = [];
    let circlenum = 0;

    let connect_1 = [];
    let connect_2 = [];

    function addCircle(posx, posy, rad, col, velx, vely) {
        const svg = document.querySelector("svg");
        const newCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const newText = document.createElementNS("http://www.w3.org/2000/svg", "text");

        newCircle.setAttribute("cx", posx);
        newCircle.setAttribute("cy", posy);
        newCircle.setAttribute("r", rad);
        newCircle.setAttribute("fill", getRandomColor());

        newText.setAttribute("x", posx);
        newText.setAttribute("y", posy);
        newText.innerHTML = circlenum;

        circle_velocity_x.push(velx);
        circle_velocity_y.push(vely);
        circlenum += 1

        svg.appendChild(newCircle);
    }

    function addCon(cona,conb) {
        a = cona;
        b = conb;
        connect_1.push(Math.floor(a));
        connect_2.push(Math.floor(b));
        const svg = document.querySelector("svg");
        const circles = svg.getElementsByTagName("circle")
        const newLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
        newLine.style.stroke = "black";
        newLine.style.strokeWidth = "2";
        svg.appendChild(newLine);
        console.log(newLine);
        };

    function getRandomColor() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * letters.length)];
        }
        return color;
    };

    function updateCircles() {
        const svg = document.querySelector("svg");
        const circles = svg.getElementsByTagName("circle");
        const labels = svg.getElementsByTagName("text");
        for (let i = 0; i < circles.length; i++) {
            let cx = parseFloat(circles[i].getAttribute("cx"));
            let cy = parseFloat(circles[i].getAttribute("cy"));
            circle_velocity_x[i] *= Friction
            circle_velocity_y[i] *= Friction
            cx = cx+(circle_velocity_x[i])
            cy = cy+(circle_velocity_y[i])

            if (cx <= radius || cx >= (screenwidth - radius)) {
                circle_velocity_x[i] = -circle_velocity_x[i];

            }
            if (cy <= radius || cy >= (screenwidth - radius)) {
                circle_velocity_y[i] = -circle_velocity_y[i];
            }

            if (cx <= -radius || cx >= (screenwidth + radius)) {
                cx = screenwidth / 2;

            }
            if (cy <= -radius || cy >= (screenwidth + radius)) {
                cy = screenheight / 2;
            }
            circles[i].setAttribute("cx", cx);
            circles[i].setAttribute("cy", cy);

            circle_velocity_y[i] += gravity;
            
        }
    }
    
    function updateConnections() {
        const svg = document.querySelector("svg");
        const circles = svg.getElementsByTagName("circle");
        const Line = svg.getElementsByTagName("line");
        for (let i = 0; i < connect_1.length; i++) {
            Line[i].setAttribute("x1",circles[connect_1[i]].cx.baseVal.value);
            Line[i].setAttribute("y1",circles[connect_1[i]].cy.baseVal.value);
            Line[i].setAttribute("x2",circles[connect_2[i]].cx.baseVal.value);
            Line[i].setAttribute("y2",circles[connect_2[i]].cy.baseVal.value);
        }
    }

    function updateCirclesWithConnections() {
        const svg = document.querySelector("svg");
        const circles = svg.getElementsByTagName("circle");
        const Line = svg.getElementsByTagName("line");
        for (let i = 0; i < connect_1.length; i++) {
            a = connect_1[i]
            b = connect_2[i]

            cx_1 = circles[a].cx.baseVal.value
            cy_1 = circles[a].cy.baseVal.value

            cx_2 = circles[b].cx.baseVal.value
            cy_2 = circles[b].cy.baseVal.value

            dist = Math.sqrt(Math.pow(cx_1 - cx_2,2) + Math.pow(cy_1 - cy_2,2))
            circle_velocity_x[a] = (circle_velocity_x[a]) - (dist * (cx_1-cx_2) / 2000000);
            circle_velocity_y[a] = (circle_velocity_y[a]) - (dist * (cy_1-cy_2) / 2000000);

            
            circle_velocity_x[b] = (circle_velocity_x[b]) - (dist * (cx_2-cx_1) / 2000000);
            circle_velocity_y[b] = (circle_velocity_y[b]) - (dist * (cy_2-cy_1) / 2000000);
            
            circles[a].setAttribute("cx", cx_1);
            circles[a].setAttribute("cy", cy_1);
            circles[b].setAttribute("cx", cx_2);
            circles[b].setAttribute("cy", cy_2);
        }
    }
    
    function tick() {
        updateCircles()
        updateConnections()
        updateCirclesWithConnections()
    }
    setInterval(tick, 1000 / FPS)
</script>
