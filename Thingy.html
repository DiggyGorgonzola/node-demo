<!DOCTYPE html>
<style>

</style>
<head>
    <title>Node demo</title>
    <link rel="icon" type="image/png" href="https://images-ext-1.discordapp.net/external/G-GxnuHyZoNCXyzhinV-fvwy9CWDTKhDvY9duLbpJm0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/747255405616562269/11fb80cf255901f2cbc34bed3b925fcf.png?format=webp&quality=lossless&width=245&height=245">
</head>
<body>
    <svg height="800px" width="800px" style="border:5px double black;">
    </svg>
    <br>
    <div style="border:1px solid black;width:fit-content;margin:5px;padding:5px;">
        <button onclick="addCircle(Math.random() * (screenheight - 2 * radius) + radius,Math.random() * (screenheight - 2 * radius) + radius,radius,getRandomColor(),Math.floor(Math.random() * start_velo) - (start_velo / 2),Math.floor(Math.random() * start_velo) - (start_velo / 2),circlenum)">Add Random Circle</button>
        <button onclick="addCon(Math.floor(Math.random() * circlenum), Math.floor(Math.random() * circlenum),Math.random(),getRandomColor())">Add Random Connection</button>
    </div>
    <div style="border:1px solid black;width:fit-content;margin:5px;padding:5px;">
        <h>Ball Radius: </h>
        <input id="inp1" type="number" value="20"><br>

        <h>Gravity: </h>
        <input id="inp2" type="number" value="0"><br>

        <h>Friction: </h>
        <input id="inp3" type="number" step="0.01" value="0.99"><br>

        <h>FPS: </h>
        <input id="inp4" type="number" value="60"><br>

        <h>Random Start Velocity: </h>
        <input id="inp5" type="number" value="10"><br>
    </div>
    <div style="border:1px solid black;width:fit-content;margin:5px;padding:5px;">
        <h>Ball Color:</h>
        <input id="color" type="color" placeholder="Enter a hex color..."><br>

        <h>Ball Label:</h>
        <input id="balls-label" type="text" placeholder="Enter label"><br>

        <button onclick="addCircle(Math.random() * (screenwidth - 2 * radius),Math.random() * (screenheight - 2 * radius),radius,String(document.getElementById('color').value),0,0,String(document.getElementById('balls-label').value))">Click!</button>
    </div>

    <div style="border:1px solid black;width:fit-content;margin:5px;padding:5px;">
        <button onclick="add_agent(Math.random() * (screenwidth - 2 * radius),Math.random() * (screenwidth - 2 * radius),0,0,Math.floor(Math.random() * circlenum),radius / 2, '#FF0000')">Add Agent</button>
    </div>
    <div style="border:1px solid black;width:fit-content;margin:5px;padding:5px;">
        <button onclick="apply_agent_func()">Agent step!</button>
    </div>
</body>
<script>
    let screenwidth = 800;
    let screenheight = 800;
    let radius = 20;
    let gravity = 0;
    let Friction = .98;
    let FPS = 60;
    let start_velo = 10;
    let damp = 5;
    let nodes = [];
    // {x, y, vx, vy, r, label, col}

    let connects = [];
    // {a, b, strength, col}
    let circlenum = 0;
    let labels = [];

    let agent_num = 0;
    let agents = [];
    // {x, y, vx, vy,target, func}
    function collatz(x) {
        if (x % 2 == 1) {
            return 3 * x + 1;
        } else {
            return x / 2;
        };
    }
    function agent_func(x) {
        const svg = document.querySelector("svg");
        let new_node = nodes.find(nodes => nodes.label == collatz(x));
        while (!new_node) {
            console.log(circlenum)
            addCircle(
                Math.random() * (screenwidth - 2 * radius),
                Math.random() * (screenheight - 2 * radius),
                radius,
                String(document.getElementById('color').value),
                0,
                0,
                `${circlenum}`)
            new_node = nodes.find(nodes => nodes.label === l);
        }
        console.log(new_node);
        addCon(x,nodes.indexOf(new_node),1,"black");
        return nodes.indexOf(new_node);
    };

    function apply_agent_func() {
        for (i = 0; i < agents.length; i++) {
            agents[i].target = agent_func(agents[i].target)
        }
    }

    function add_agent(posx,posy,vx,vy,target,rad,col) {
        const svg = document.querySelector("svg");
        const circles = svg.getElementsByTagName("circle");
        const newAgent = document.createElementNS("http://www.w3.org/2000/svg", "circle");

        newAgent.setAttribute("cx",posx)
        newAgent.setAttribute("cy",posy)
        newAgent.setAttribute("r",rad)
        newAgent.setAttribute("fill",col)



        agents.push({posx,posy,vx,vy,target,rad,col,newAgent});
        console.log(agents);
        svg.append(newAgent);
    }
    const inp1 = document.getElementById("inp1");
    const inp2 = document.getElementById("inp2");
    const inp3 = document.getElementById("inp3");
    const inp4 = document.getElementById("inp4");
    const inp5 = document.getElementById("inp5");

    inp1.addEventListener("input", () => {
        radius = Number(inp1.value);
    });

    inp2.addEventListener("input", () => {
        gravity = Number(inp2.value);
    });

    inp3.addEventListener("input", () => {
        Friction = Number(inp3.value);
    });

    inp4.addEventListener("input", () => {
        FPS = Number(inp4.value);
        restartTimer();
    });

    inp5.addEventListener("input", () => {
        start_velo = Number(inp5.value);
    });

    function addCircle(posx, posy, rad, col, velx, vely, label) {
        const svg = document.querySelector("svg");
        const newCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        newCircle.setAttribute("cx", posx);
        newCircle.setAttribute("cy", posy);
        newCircle.setAttribute("r", rad);
        newCircle.setAttribute("fill", col);

        const newText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        newText.setAttribute("x", posx);
        newText.setAttribute("y", posy - radius / 3);
        newText.setAttribute("text-anchor", "middle");
        newText.setAttribute("font-size", `${radius}`);
        newText.setAttribute("fill", "black");
        newText.textContent = label;
        nodes.push({posx,posy,velx,vely,rad,label,col,newCircle,newText});
        circlenum += 1

        svg.appendChild(newCircle);
        svg.appendChild(newText);
    }

    function addCon(cona,conb,strength,col) {
        const svg = document.querySelector("svg");
        const newLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
        newLine.setAttribute("stroke", col);
        newLine.setAttribute("stroke-width", `${strength * 2}px`);
        svg.appendChild(newLine);
        connects.push({cona,conb,strength,col,newLine});
        console.log(newLine);
        };

    function getRandomColor() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * letters.length)];
        }
        return color;
    };

    function updateCircles() {
        applyRepulsion()
        const svg = document.querySelector("svg");
        const labels = svg.getElementsByTagName("text");
        for (let i = 0; i < nodes.length; i++) {
            let cx = parseFloat(nodes[i].posx);
            let cy = parseFloat(nodes[i].posy);
            nodes[i].velx *= Friction
            nodes[i].vely *= Friction
            cx += parseFloat((nodes[i].velx*60)/FPS)
            cy += parseFloat((nodes[i].vely*60)/FPS)

            if (cx <= nodes[i].rad || cx >= (screenwidth - nodes[i].rad  )) {
                nodes[i].velx = -nodes[i].velx;

            }
            if (cy <= nodes[i].rad   || cy >= (screenheight - nodes[i].rad  )) {
                nodes[i].vely = -nodes[i].vely;
            }

            if (cx <= -nodes[i].rad   || cx >= (screenwidth + nodes[i].rad  )) {
                cx = screenwidth / 2;

            }
            if (cy <= -nodes[i].rad   || cy >= (screenheight + nodes[i].rad  )) {
                cy = screenheight / 2;
            }
            nodes[i].posx = cx;
            nodes[i].posy = cy;

            nodes[i].vely += gravity/FPS;

            nodes[i].newCircle.setAttribute("cx",nodes[i].posx)
            nodes[i].newCircle.setAttribute("cy",nodes[i].posy)
            nodes[i].newCircle.setAttribute("r",nodes[i].rad)
            nodes[i].newCircle.setAttribute("fill",nodes[i].col)

            nodes[i].newText.setAttribute("x",nodes[i].posx)
            nodes[i].newText.setAttribute("y",nodes[i].posy)
        }
        for (let i = 0; i < agents.length; i++) {
            agents[i].posx -= (agents[i].posx - nodes[agents[i].target].posx)/2;
            agents[i].posy -= (agents[i].posy - nodes[agents[i].target].posy + 2*nodes[agents[i].target].rad)/2;

            agents[i].newAgent.setAttribute("cx",agents[i].posx)
            agents[i].newAgent.setAttribute("cy",agents[i].posy)
            agents[i].newAgent.setAttribute("r",agents[i].rad)
            agents[i].newAgent.setAttribute("fill",agents[i].col)
        }
    }
    function applyRepulsion() {
        const repulsionStrength = 1000;

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dx = nodes[j].posx - nodes[i].posx;
                const dy = nodes[j].posy - nodes[i].posy;
                const distSq = dx * dx + dy * dy;
                const minDist = nodes[i].rad*2 + nodes[j].rad*2;

                if (distSq < minDist * minDist && distSq > 0) {
                    const force = repulsionStrength / distSq;

                    const dist = Math.sqrt(distSq);
                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;
                    nodes[i].velx -= fx;
                    nodes[i].vely -= fy;
                    nodes[j].velx += fx;
                    nodes[j].vely += fy;
                }
            }
        }
    }
    function updateConnections() {
        const svg = document.querySelector("svg");
        for (let i = 0; i < connects.length; i++) {
            connects[i].newLine.setAttribute("x1",nodes[connects[i].cona].posx);
            connects[i].newLine.setAttribute("y1",nodes[connects[i].cona].posy);
            connects[i].newLine.setAttribute("x2",nodes[connects[i].conb].posx);
            connects[i].newLine.setAttribute("y2",nodes[connects[i].conb].posy);
        }
    }

    function updateCirclesWithConnections() {
        const svg = document.querySelector("svg");
        const circles = svg.getElementsByTagName("circle");
        const Line = svg.getElementsByTagName("line");
        for (let i = 0; i < connects.length; i++) {
            a = connects[i].cona;
            b = connects[i].conb;

            cx_1 = nodes[a].posx;
            cy_1 = nodes[a].posy;

            cx_2 = nodes[b].posx;
            cy_2 = nodes[b].posy;
            dist = Math.sqrt(Math.pow(cx_1 - cx_2,2) + Math.pow(cy_1 - cy_2,2))
            nodes[a].velx = (nodes[a].velx) - ((dist - 8 * nodes[a].rad) * (cx_1-cx_2)/(screenwidth * FPS * damp)*connects[i].strength);
            nodes[a].vely = (nodes[a].vely) - ((dist - 8 * nodes[a].rad) * (cy_1-cy_2)/(screenheight * FPS * damp)*connects[i].strength);

            
            nodes[b].velx = (nodes[b].velx) - ((dist - 8 * nodes[b].rad) * (cx_2-cx_1)/(screenwidth * FPS * damp)*connects[i].strength);
            nodes[b].vely = (nodes[b].vely) - ((dist - 8 * nodes[b].rad) * (cy_2-cy_1)/(screenheight * FPS * damp)*connects[i].strength);

            
            nodes[a].newCircle.setAttribute("cx", cx_1);
            nodes[a].newCircle.setAttribute("cy", cy_1);
            nodes[b].newCircle.setAttribute("cx", cx_2);
            nodes[b].newCircle.setAttribute("cy", cy_2);
        }
    }
    
    let timer = setInterval(tick, 1000 / FPS);

    function tick() {
        updateCircles()
        updateConnections()
        updateCirclesWithConnections()
    }
    function restartTimer() {
        clearInterval(timer);
        timer = setInterval(tick, 1000 / FPS);
    }
</script>
